<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NexTerm</title>
  <link rel="stylesheet" href="xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <img class="app-mark" src="icon.svg" alt="" width="18" height="18" />
      <button id="btn-sidebar" class="icon-btn" title="Toggle sidebar (Ctrl+Shift+B)" aria-label="Toggle sidebar"></button>
      <div id="tabs" role="tablist" aria-label="Open sessions"></div>
      <button id="btn-newtab" class="icon-btn" title="New local terminal (Ctrl+Shift+T)" aria-label="New local terminal"></button>
      <div class="drag-fill"></div>
      <button id="btn-palette" class="palette-hint" title="Command palette (Ctrl+Shift+P)"></button>
    </header>

    <div id="body">
      <aside id="sidebar" aria-label="Saved sessions"></aside>
      <div id="sidebar-resizer" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
      <main id="workspace">
        <div id="welcome"></div>
        <div id="panes"></div>
      </main>
    </div>

    <footer id="statusbar"></footer>
  </div>
  <div id="menus"></div>
  <div id="dialogs"></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
